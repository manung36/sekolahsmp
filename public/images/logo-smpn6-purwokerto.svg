<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradSchool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Lingkaran Luar / Pelindung -->
  <circle cx="120" cy="120" r="112" fill="#ffffff" stroke="#0d9488" stroke-width="5" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2" />

  <!-- Simbol Matahari / Lingkaran Menjulang ke Atas Era Digital -->
  <circle cx="120" cy="65" r="28" fill="url(#gradAccent)" filter="url(#shadow)" />
  <circle cx="120" cy="65" r="18" fill="#ffffff" />
  <circle cx="120" cy="65" r="10" fill="#0d9488" />

  <!-- Buku Terbuka / Sayap Pendidikan Ilmu Pengetahuan -->
  <path d="M60 125 C85 105, 115 118, 120 128 C125 118, 155 105, 180 125 C165 145, 130 140, 120 152 C110 140, 75 145, 60 125 Z" fill="#0f766e" />
  <path d="M68 127 C90 112, 115 122, 120 131 C125 122, 150 112, 172 127" fill="none" stroke="#fef3c7" stroke-width="2" />

  <!-- Konstruksi Bidang Bersiku Vertikal & Horisontal (Habluminallah & Habluminannas) -->
  <path d="M116 85 L124 85 L124 162 L116 162 Z" fill="#0d9488" />
  <path d="M92 138 L148 138 L148 146 L92 146 Z" fill="url(#gradAccent)" />

  <!-- Pita Pengikat Prestasi -->
  <path d="M45 170 Q120 195 195 170 L188 186 Q120 210 52 186 Z" fill="#134e4a" />

  <!-- Tulisan SMP NEGERI 6 PURWOKERTO -->
  <text x="120" y="181" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">
    SMP NEGERI 6 PURWOKERTO
  </text>
  
  <!-- Tahun Berdiri 1979 -->
  <text x="120" y="196" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="2">
    EST. 1979
  </text>
</svg>
